name: Build & Validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python3 build.py
      - name: Validate (JSON-LD + links)
        run: python3 validate.py
